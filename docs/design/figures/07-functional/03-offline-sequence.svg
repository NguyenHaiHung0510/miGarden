<text x="36" y="1556" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#506477" text-anchor="start"><tspan x="36" dy="0">Ca này dùng I01, I02, I04–I07; không có remote intent I03. Duration được báo chưa là lượng nước.</tspan></text></svg>