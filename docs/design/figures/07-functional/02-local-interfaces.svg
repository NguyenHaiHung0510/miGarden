<text x="640" y="483.5" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#173247" text-anchor="middle"><tspan x="640" dy="0">G05 • Arbiter / Execution</tspan><tspan x="640" dy="33">START có điều kiện</tspan><tspan x="640" dy="33">STOP ưu tiên CLOSE</tspan></text>
<rect x="70" y="740" width="520" height="160" rx="14" fill="#EAF6EF" stroke="#48677E" stroke-width="2" />
<text x="330" y="793.5" font-family="Segoe UI,Arial,sans-serif" font-size="25" fill="#173247" text-anchor="middle"><tspan x="330" dy="0">G06 • Căn cứ tin cậy</tspan><tspan x="330" dy="33">Time • critical persistence</tspan><tspan x="330" dy="33">Accounting • recovery</tspan></text>
