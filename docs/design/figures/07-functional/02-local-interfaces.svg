<polyline points="840,510 1155,510 1155,740" fill="none" stroke="#48677E" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#head)" marker-start="url(#head)"/>
<text x="865" y="625" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#173247" text-anchor="start"><tspan x="865" dy="0">I07 • Output command</tspan><tspan x="865" dy="26.400000000000002">Feedback chỉ nếu thực có</tspan></text>
<text x="70" y="956" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#506477" text-anchor="start"><tspan x="70" dy="0">G06 không là service cloud. G07 không có đường OPEN riêng.</tspan><tspan x="70" dy="27.720000000000002">Output được báo không thay bằng chứng vị trí van / flow; van khóa tay vẫn độc lập.</tspan></text>
<text x="36" y="1016" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#506477" text-anchor="start"><tspan x="36" dy="0">Sơ đồ chỉ phân công trách nhiệm; chưa chọn GPIO, gesture/debounce, driver, cảm biến hay cutoff.</tspan></text></svg>