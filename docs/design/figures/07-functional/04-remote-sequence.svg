<text x="36" y="1676" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#506477" text-anchor="start"><tspan x="36" dy="0">Web thiếu report ≠ local mất state. Local unresolved thì chặn OPEN trên ranh giới chung; recovery ở 08.</tspan></text></svg>