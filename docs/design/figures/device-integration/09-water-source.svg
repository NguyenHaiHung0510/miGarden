<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1178" viewBox="0 0 1530 1178" role="img" aria-labelledby="title desc"><title id="title">Cụm nước: đủ bốn cổng và rõ từng cặp ren</title><desc id="desc">Hai cổng bịt, một cổng rửa và một cổng tưới. Đầu nối 27–21 và 21–21 có hai nhiệm vụ khác nhau.</desc><rect width="1530" height="1178" fill="#f3f7fb"/><g font-family="Arial, sans-serif"><rect width="1530" height="128" fill="#17354d"/><text x="42" y="34" font-size="18" fill="#a7dddd" font-weight="bold" text-anchor="start">MIGARDEN · THIẾT KẾ TÍCH HỢP THIẾT BỊ</text><text x="42" y="80" font-size="36" fill="#ffffff" font-weight="bold" text-anchor="start">Cụm nước: đủ bốn cổng và rõ từng cặp ren</text><text x="42" y="112" font-size="18" fill="#d3e5f0" font-weight="normal" text-anchor="start">Hai cổng bịt, một cổng rửa và một cổng tưới. Đầu nối 27–21 và 21–21 có hai nhiệm vụ khác nhau.</text><rect x="48" y="178" width="292" height="117" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="65" y="211" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Vòi đỏ hiện có</text><text x="65" y="241" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đầu ra: ren ngoài 27</text><rect x="433" y="178" width="351" height="117" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="450" y="211" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Nối hai ren trong 27–21</text><text x="450" y="241" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">27 cái nhận vòi đỏ</text><text x="450" y="268" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">21 cái nhận bộ chia</text><rect x="887" y="178" width="595" height="117" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="904" y="211" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Bộ chia DNV5 · một khóa tổng</text><text x="904" y="241" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đầu vào ren ngoài 21; bốn đầu ra ren ngoài 21</text><path d="M340 237 L433 237" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M433 237 L423.0 243.0 L423.0 231.0 Z" fill="#156b9a"/><path d="M784 237 L887 237" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M887 237 L877.0 243.0 L877.0 231.0 Z" fill="#156b9a"/><path d="M1178 295 L1178 361" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M173 361 L1276 361" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M173 361 L173 418" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M173 418 L167.0 408.0 L179.0 408.0 Z" fill="#156b9a"/><path d="M493 361 L493 418" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M493 418 L487.0 408.0 L499.0 408.0 Z" fill="#156b9a"/><path d="M876 361 L876 418" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M876 418 L870.0 408.0 L882.0 408.0 Z" fill="#156b9a"/><path d="M1276 361 L1276 418" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M1276 418 L1270.0 408.0 L1282.0 408.0 Z" fill="#156b9a"/><rect x="48" y="418" width="250" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="65" y="451" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Cổng chưa dùng</text><text x="65" y="481" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">21 ngoài → nắp 21 trong</text><text x="65" y="508" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Bịt kín chịu áp</text><rect x="368" y="418" width="250" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="385" y="451" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Cổng chưa dùng</text><text x="385" y="481" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">21 ngoài → nắp 21 trong</text><text x="385" y="508" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Bịt kín chịu áp</text><rect x="681" y="418" width="389" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="698" y="451" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Cổng rửa · 21 ngoài</text><text x="698" y="481" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đường mở tay, không qua van điện</text><rect x="1126" y="418" width="356" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="1143" y="451" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Cổng A · 21 ngoài</text><text x="1143" y="481" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đường tự động Zone A</text><path d="M876 534 L876 604" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M876 604 L870.0 594.0 L882.0 594.0 Z" fill="#156b9a"/><rect x="681" y="604" width="389" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="698" y="637" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Nối hai ren trong 21–21</text><text x="698" y="667" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Một đầu nhận DNV5</text><text x="698" y="694" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Một đầu nhận vòi đồng</text><path d="M876 720 L876 792" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M876 792 L870.0 782.0 L882.0 782.0 Z" fill="#156b9a"/><rect x="681" y="792" width="389" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="698" y="825" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Vòi đồng · đầu vào 21 ngoài</text><text x="698" y="855" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đặt miệng xả đúng hướng</text><text x="698" y="882" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Có thể nối ống rửa sàn</text><path d="M1304 534 L1304 604" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M1304 604 L1298.0 594.0 L1310.0 594.0 Z" fill="#156b9a"/><rect x="1126" y="604" width="356" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="1143" y="637" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Dây cấp PVC 1,2 m</text><text x="1143" y="667" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đầu 1: tán 21 trong</text><text x="1143" y="694" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đầu 2: tán 21 trong</text><path d="M1304 720 L1304 792" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M1304 792 L1298.0 782.0 L1310.0 782.0 Z" fill="#156b9a"/><rect x="1126" y="792" width="356" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="1143" y="825" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Van VAKS · NC 12 V</text><text x="1143" y="855" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Vào 21 ngoài → ra 21 ngoài</text><text x="1143" y="882" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Lắp theo chiều mũi tên</text><path d="M1304 908 L1304 980" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M1304 980 L1298.0 970.0 L1310.0 970.0 Z" fill="#156b9a"/><rect x="1126" y="980" width="356" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="1143" y="1013" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Đầu đổi mua local</text><text x="1143" y="1043" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ren trong đúng van → ổ dán Ø21</text><text x="1143" y="1070" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">→ Ống uPVC Ø21 chịu áp</text><rect x="48" y="604" width="570" height="304" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="65" y="637" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Đọc cỡ nối và chỗ làm kín</text><text x="65" y="667" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ren ngoài ghép ren trong đúng cỡ và chuẩn.</text><text x="65" y="694" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Tán xoay / nắp có mặt tì: dùng gioăng đúng loại.</text><text x="65" y="721" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Mối kín trên ren: dùng vật liệu làm kín theo đầu nối.</text><text x="65" y="748" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ổ trơn uPVC mới dán bằng keo PVC.</text><text x="65" y="775" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">“Ren 21” và đường kính ống Ø21 là hai việc khác.</text><text x="65" y="802" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Thử khớp trước khi dán hoặc gá cố định.</text><text x="48" y="1010" font-size="20" fill="#466279" font-weight="normal" text-anchor="start">Van lên tường phải nhờ một dây mềm; không mặc định thêm dây mềm thứ hai,</text><text x="48" y="1043" font-size="20" fill="#466279" font-weight="normal" text-anchor="start">lọc hoặc hai rắc co. Chỉ thêm điểm tháo nếu chỗ thực không thể tháo van.</text><text x="48" y="1149" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Cỡ ren là cấu hình dự kiến của món đã chọn; mặt kín và hàng thực cần đối chiếu khi lắp.</text></g></svg>