<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1070" viewBox="0 0 1530 1070" role="img" aria-labelledby="title desc"><title id="title">Đi chung tới dưới rào cũ; bộ Y để đợt sau</title><desc id="desc">Kết thúc đợt một là đầu chờ có bịt. Khi mở rộng, chỉ chia tại đây thành hai nhánh mềm linh hoạt.</desc><rect width="1530" height="1070" fill="#f3f7fb"/><g font-family="Arial, sans-serif"><rect width="1530" height="128" fill="#17354d"/><text x="42" y="34" font-size="18" fill="#a7dddd" font-weight="bold" text-anchor="start">MIGARDEN · THIẾT KẾ TÍCH HỢP THIẾT BỊ</text><text x="42" y="80" font-size="36" fill="#ffffff" font-weight="bold" text-anchor="start">Đi chung tới dưới rào cũ; bộ Y để đợt sau</text><text x="42" y="112" font-size="18" fill="#d3e5f0" font-weight="normal" text-anchor="start">Kết thúc đợt một là đầu chờ có bịt. Khi mở rộng, chỉ chia tại đây thành hai nhánh mềm linh hoạt.</text><rect x="48" y="177" width="300" height="112" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="65" y="210" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Van trên tường phải</text><text x="65" y="240" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Một dây mềm từ DNV5</text><text x="65" y="267" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Nguồn nước chung Zone A</text><rect x="427" y="177" width="332" height="112" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="444" y="210" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Đầu đổi ren → ổ dán</text><text x="444" y="240" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ren trong khớp đầu ra van</text><text x="444" y="267" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ổ dán nhận ống uPVC Ø21</text><rect x="842" y="177" width="640" height="112" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="859" y="210" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Một tuyến ống cứng đi chung xuống ban công</text><text x="859" y="240" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Bám tường; chưa chia ở phía sân thượng</text><text x="859" y="267" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Gá và chiều dài cắt theo hiện trường</text><path d="M348 233 L427 233" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M427 233 L417.0 239.0 L417.0 227.0 Z" fill="#156b9a"/><path d="M759 233 L842 233" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M842 233 L832.0 239.0 L832.0 227.0 Z" fill="#156b9a"/><path d="M1162 289 L1162 379" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M1162 379 L783 379" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M783 379 L783 445" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M783 445 L777.0 435.0 L789.0 435.0 Z" fill="#156b9a"/><rect x="575" y="445" width="416" height="116" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="592" y="478" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Đầu chờ dưới đỉnh rào cũ</text><text x="592" y="508" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Hiện tại: có nắp chịu áp tháo được</text><text x="592" y="535" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Chỉ mở khi có đường xả kiểm soát</text><path d="M783.00 561.00 L783.00 573.40 M783.00 579.40 L783.00 591.80 M783.00 597.80 L783.00 610.20 M783.00 616.20 L783.00 628.60 M783.00 634.60 L783.00 647.00" fill="none" stroke="#6f7f90" stroke-width="4" stroke-linejoin="round"/><path d="M783 647 L777.0 637.0 L789.0 637.0 Z" fill="#6f7f90"/><rect x="575" y="647" width="416" height="116" rx="15" fill="#f0f3f6" stroke="#a9b4bf" stroke-width="2"/><text x="592" y="680" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Đợt sau · gắn bộ chia Y</text><text x="592" y="710" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ổ dán Ø21 → ren 21 ngoài → Y 21 cái</text><text x="592" y="737" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Hai khớp ra phù hợp ống mềm 10 mm</text><path d="M575.00 705.00 L563.56 705.00 M557.56 705.00 L546.12 705.00 M540.12 705.00 L528.69 705.00 M522.69 705.00 L511.25 705.00 M505.25 705.00 L493.81 705.00 M487.81 705.00 L476.38 705.00 M470.38 705.00 L458.94 705.00 M452.94 705.00 L441.50 705.00 M435.50 705.00 L424.06 705.00 M418.06 705.00 L406.62 705.00 M400.62 705.00 L389.19 705.00 M383.19 705.00 L371.75 705.00 M365.75 705.00 L354.31 705.00 M348.31 705.00 L336.88 705.00 M330.88 705.00 L319.44 705.00 M313.44 705.00 L302.00 705.00" fill="none" stroke="#6f7f90" stroke-width="4" stroke-linejoin="round"/><path d="M302.00 705.00 L302.00 716.75 M302.00 722.75 L302.00 734.50 M302.00 740.50 L302.00 752.25 M302.00 758.25 L302.00 770.00 M302.00 776.00 L302.00 787.75 M302.00 793.75 L302.00 805.50 M302.00 811.50 L302.00 823.25 M302.00 829.25 L302.00 841.00" fill="none" stroke="#6f7f90" stroke-width="4" stroke-linejoin="round"/><path d="M302 841 L296.0 831.0 L308.0 831.0 Z" fill="#6f7f90"/><path d="M991.00 705.00 L1002.64 705.00 M1008.64 705.00 L1020.29 705.00 M1026.29 705.00 L1037.93 705.00 M1043.93 705.00 L1055.57 705.00 M1061.57 705.00 L1073.21 705.00 M1079.21 705.00 L1090.86 705.00 M1096.86 705.00 L1108.50 705.00 M1114.50 705.00 L1126.14 705.00 M1132.14 705.00 L1143.79 705.00 M1149.79 705.00 L1161.43 705.00 M1167.43 705.00 L1179.07 705.00 M1185.07 705.00 L1196.71 705.00 M1202.71 705.00 L1214.36 705.00 M1220.36 705.00 L1232.00 705.00" fill="none" stroke="#6f7f90" stroke-width="4" stroke-linejoin="round"/><path d="M1232.00 705.00 L1232.00 716.75 M1232.00 722.75 L1232.00 734.50 M1232.00 740.50 L1232.00 752.25 M1232.00 758.25 L1232.00 770.00 M1232.00 776.00 L1232.00 787.75 M1232.00 793.75 L1232.00 805.50 M1232.00 811.50 L1232.00 823.25 M1232.00 829.25 L1232.00 841.00" fill="none" stroke="#6f7f90" stroke-width="4" stroke-linejoin="round"/><path d="M1232 841 L1226.0 831.0 L1238.0 831.0 Z" fill="#6f7f90"/><rect x="48" y="841" width="507" height="140" rx="15" fill="#f0f3f6" stroke="#a9b4bf" stroke-width="2"/><text x="65" y="874" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Nhánh gần cửa · tự bố trí</text><text x="65" y="904" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ống mềm + tê + béc theo vùng cây</text><text x="65" y="931" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Một nút bịt cuối tháo được</text><text x="65" y="958" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Chung van và lịch Zone A</text><rect x="977" y="841" width="505" height="140" rx="15" fill="#f0f3f6" stroke="#a9b4bf" stroke-width="2"/><text x="994" y="874" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Nhánh ban công mới · tự bố trí</text><text x="994" y="904" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ống mềm dọc rào và về tường trái</text><text x="994" y="931" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Một nút bịt cuối tháo được</text><text x="994" y="958" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Chung van và lịch Zone A</text><rect x="48" y="355" width="440" height="265" rx="15" fill="#ffffff" stroke="#adbfce" stroke-width="2"/><text x="65" y="388" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Chỗ gá và khoảng nới còn linh hoạt</text><text x="65" y="418" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đầu chờ / điểm Y ở dưới đỉnh rào cũ.</text><text x="65" y="445" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Gợi ý hạ 10–20 cm để có chỗ gá;</text><text x="65" y="472" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">không phải kích thước bắt buộc.</text><text x="65" y="499" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Khoảng nới 1,07 m chỉ là ước lượng.</text><text x="65" y="526" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Không cố định vị trí béc theo từng chậu.</text><text x="48" y="1041" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Nét xanh: lắp trong đợt một. Nét xám đứt: đường tương lai, chưa tính là đã có hoặc đã kiểm nước.</text></g></svg>