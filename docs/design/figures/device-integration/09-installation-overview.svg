y="778" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Hai tán 21 cái</text><text x="643" y="805" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đưa van lên tường phải</text><rect x="972" y="715" width="250" height="112" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="989" y="748" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Van NC 12 V</text><text x="989" y="778" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Mất điện: đóng</text><text x="989" y="805" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Theo điều kiện van thật</text><rect x="1288" y="715" width="194" height="112" rx="15" fill="#eaf5fb" stroke="#85b4d0" stroke-width="2"/><text x="1305" y="748" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">uPVC Ø21</text><text x="1305" y="778" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Tới đầu chờ</text><text x="1305" y="805" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Có nắp bịt</text><path d="M258 771 L324 771" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M324 771 L314.0 777.0 L314.0 765.0 Z" fill="#156b9a"/><path d="M556 771 L626 771" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M626 771 L616.0 777.0 L616.0 765.0 Z" fill="#156b9a"/><path d="M895 771 L972 771" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M972 771 L962.0 777.0 L962.0 765.0 Z" fill="#156b9a"/><path d="M1222 771 L1288 771" fill="none" stroke="#156b9a" stroke-width="4" stroke-linejoin="round"/><path d="M1288 771 L1278.0 777.0 L1278.0 765.0 Z" fill="#156b9a"/><path d="M1097 587 L1097 715" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M1097 715 L1091.0 705.0 L1103.0 705.0 Z" fill="#af4c27"/><text x="1114" y="640" font-size="18" fill="#af4c27" font-weight="norma