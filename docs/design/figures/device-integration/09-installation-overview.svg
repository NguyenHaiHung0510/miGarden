<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1100" viewBox="0 0 1530 1100" role="img" aria-labelledby="title desc"><title id="title">Từ web, ổ điện và vòi nước tới van Zone A</title><desc id="desc">Đồ thị lắp đặt tổng thể. Bơm giữ hệ điều khiển hiện hữu; miGarden điều khiển van.</desc><rect width="1530" height="1100" fill="#f3f7fb"/><g font-family="Arial, sans-serif"><rect width="1530" height="128" fill="#17354d"/><text x="42" y="34" font-size="18" fill="#a7dddd" font-weight="bold" text-anchor="start">MIGARDEN · THIẾT KẾ TÍCH HỢP THIẾT BỊ</text><text x="42" y="80" font-size="36" fill="#ffffff" font-weight="bold" text-anchor="start">Từ web, ổ điện và vòi nước tới van Zone A</text><text x="42" y="112" font-size="18" fill="#d3e5f0" font-weight="normal" text-anchor="start">Đồ thị lắp đặt tổng thể. Bơm giữ hệ điều khiển hiện hữu; miGarden điều khiển van.</text><rect x="48" y="174" width="260" height="101" rx="15" fill="#f0eafa" stroke="#b49acb" stroke-width="2"/><text x="65" y="207" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Browser / microSched</text><text x="65" y="237" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Bạn đặt lịch, START/STOP</text><rect x="404" y="174" width="310" height="101" rx="15" fill="#f0eafa" stroke="#b49acb" stroke-width="2"/><text x="421" y="207" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">microSched server</text><text x="421" y="237" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Lịch, lệnh, reports, lịch sử</text><rect x="972" y="174" width="510" height="118" rx="15" fill="#f0eafa" stroke="#b49acb" stroke-width="2"/><text x="989" y="207" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">ESP32 tại vườn</text><text x="989" y="237" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Lịch local và xử lý START/STOP</text><text x="989" y="264" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Giữ trạng thái, gửi kết quả</text><path d="M308 225 L404 225" fill="none" stroke="#7442a1" stroke-width="4" stroke-linejoin="round"/><path d="M404 225 L394.0 231.0 L394.0 219.0 Z" fill="#7442a1"/><path d="M714 225 L972 225" fill="none" stroke="#7442a1" stroke-width="4" stroke-linejoin="round"/><path d="M972 225 L962.0 231.0 L962.0 219.0 Z" fill="#7442a1"/><text x="756" y="205" font-size="18" fill="#7442a1" font-weight="normal" text-anchor="start">Qua Internet / Wi-Fi nhà</text><rect x="48" y="337" width="260" height="84" rx="15" fill="#fff1e8" stroke="#ce9c80" stroke-width="2"/><text x="65" y="370" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Ổ 220 V hiện hữu</text><text x="65" y="400" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Giữ đường bơm đang dùng</text><rect x="48" y="474" width="260" height="114" rx="15" fill="#fff1e8" stroke="#ce9c80" stroke-width="2"/><text x="65" y="507" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Ổ chia 5 cổng</text><text x="65" y="537" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Ba phích: bơm + A + B</text><text x="65" y="564" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Đặt khô, có che</text><path d="M178 421 L178 474" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M178 474 L172.0 464.0 L184.0 464.0 Z" fill="#af4c27"/><rect x="435" y="352" width="313" height="91" rx="15" fill="#fff1e8" stroke="#ce9c80" stroke-width="2"/><text x="452" y="385" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Adapter A · 12 V / 2 A</text><text x="452" y="415" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Cắm nguyên phích vào jack bo</text><rect x="435" y="496" width="313" height="91" rx="15" fill="#fff1e8" stroke="#ce9c80" stroke-width="2"/><text x="452" y="529" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Adapter B · 12 V / 2 A</text><text x="452" y="559" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">Qua jack cái cấp nhánh van</text><path d="M308 525 L367 525" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M367 525 L367 398" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M367 398 L435 398" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M435 398 L425.0 404.0 L425.0 392.0 Z" fill="#af4c27"/><path d="M367 525 L400 525" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M400 525 L400 541" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M400 541 L435 541" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M435 541 L425.0 547.0 L425.0 535.0 Z" fill="#af4c27"/><path d="M748 398 L902 398" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M902 398 L902 256" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M902 256 L972 256" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M972 256 L962.0 262.0 L962.0 250.0 Z" fill="#af4c27"/><rect x="972" y="480" width="510" height="107" rx="15" fill="#fff1e8" stroke="#ce9c80" stroke-width="2"/><text x="989" y="513" font-size="23" fill="#17354d" font-weight="bold" text-anchor="start">Driver MKE-M06</text><text x="989" y="543" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">S nhận lệnh; IN nhận nguồn B</text><text x="989" y="570" font-size="19" fill="#466279" font-weight="normal" text-anchor="start">OUT cấp / ngắt điện cuộn van</text><path d="M748 541 L972 541" fill="none" stroke="#af4c27" stroke-width="4" stroke-linejoin="round"/><path d="M972 541 L962.0 547.0 L962.0 535.0 Z" fill="#af4c27"/><path d="M1227 292 L1227 480" fill="none" stroke="#7442a1" stroke-width="4" stroke-linejoin="round"/><path d="M1227 480 L1221.0 470.0 L12