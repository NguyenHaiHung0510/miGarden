<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
  <title id="title">Đấu hai nút START và STOP vào ESP32</title>
  <desc id="desc">Hai điện trở riêng từ 3V3 tới IO33 và IO32. Nút xanh thường hở kéo IO33 xuống GND khi bấm. Nút đỏ thường hở như nút xanh. Nhả hoặc hở dây: IO32 HIGH. Bấm: IO32 LOW và yêu cầu STOP.</desc>
  <rect width="1440" height="950" fill="#f1f5fa"/>
  <g font-family="Arial, sans-serif">
    <rect width="1440" height="122" fill="#152f4a"/>
    <text x="44" y="35" font-size="17" font-weight="bold" fill="#9fdddc">MIGARDEN · HAI NÚT THƯỜNG HỞ</text>
    <text x="44" y="80" font-size="39" font-weight="bold" fill="#ffffff">Đấu hai nút START và STOP vào ESP32</text>
    <text x="1040" y="56" font-size="20" fill="#d1e8f2">Tiếp điểm vẽ lúc nhả nút</text>
    <text x="1040" y="84" font-size="19" fill="#d1e8f2">Chưa thử trên thiết bị</text>

    <rect x="38" y="145" width="902" height="532" rx="18" fill="#ffffff" stroke="#b3c5d6" stroke-width="2"/>
    <text x="64" y="178" font-size="21" font-weight="bold" fill="#294b67">TRONG HỘP BO · CHÂN CẮM VÀ MỐI NỐI</text>
    <rect x="973" y="145" width="429" height="532" rx="18" fill="#ffffff" stroke="#b3c5d6" stroke-width="2"/>
    <text x="999" y="178" font-size="21" font-weight="bold" fill="#294b67">NẮP HỘP HOẶC HỘP NÚT RỜI</text>

    <rect x="64" y="205" width="260" height="432" rx="16" fill="#e9eff7" stroke="#91abc4" stroke-width="2"/>
    <text x="87" y="244" font-size="23" font-weight="bold" fill="#163655">Vietduino ESP32</text>
    <text x="87" y="273" font-size="17" fill="#294b67">Đọc chữ in cạnh chân</text>
    <text x="87" y="295" font-size="17" fill="#294b67">trên bo thực.</text>
    <text x="306" y="273" text-anchor="end" font-size="20" font-weight="bold" fill="#6d3b95">3V3</text>
    <text x="306" y="365" text-anchor="end" font-size="20" font-weight="bold" fill="#087651">IO33</text>
    <text x="306" y="498" text-anchor="end" font-size="20" font-weight="bold" fill="#b13b47">IO32</text>
    <text x="306" y="609" text-anchor="end" font-size="20" font-weight="bold" fill="#2362a2">GND</text>
    <text x="87" y="552" font-size="18" fill="#294b67">IO27 vẫn đi tới S</text>
    <text x="87" y="578" font-size="18" fill="#294b67">của driver van.</text>

    <text x="361" y="237" font-size="19" fill="#694283">Một chân 3V3 cấp qua hai điện trở riêng</text>
    <path d="M324 266 H824 M548 266 V282 M548 313 V358 M824 266 V404 M824 444 V490" fill="none" stroke="#7442a1" stroke-width="4"/>
    <rect x="537" y="282" width="22" height="31" rx="2" fill="#f1e6fa" stroke="#7442a1" stroke-width="3"/>
    <rect x="813" y="404" width="22" height="40" rx="2" fill="#f1e6fa" stroke="#7442a1" stroke-width="3"/>
    <text x="570" y="304" font-size="19" font-weight="bold" fill="#694283">10 kΩ kéo IO33 lên</text>
    <text x="802" y="430" text-anchor="end" font-size="19" font-weight="bold" fill="#694283">10 kΩ kéo IO32 lên</text>
    <circle cx="548" cy="266" r="6" fill="#7442a1"/>
    <circle cx="824" cy="266" r="6" fill="#7442a1"/>

    <rect x="907" y="305" width="78" height="324" rx="18" fill="#dce6f1" opacity="0.75" stroke="#8ca3ba" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M324 358 H1075" fill="none" stroke="#087651" stroke-width="5"/>
    <path d="M324 490 H1075" fill="none" stroke="#b13b47" stroke-width="5"/>
    <path d="M324 602 H1354 V358 H1175 M1175 490 H1354" fill="none" stroke="#2362a2" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="324" cy="266" r="6" fill="#7442a1"/>
    <circle cx="324" cy="358" r="6" fill="#087651"/>
    <circle cx="324" cy="490" r="6" fill="#b13b47"/>
    <circle cx="324" cy="602" r="6" fill="#2362a2"/>
    <circle cx="548" cy="358" r="7" fill="#087651"/>
    <circle cx="824" cy="490" r="7" fill="#b13b47"/>
    <circle cx="1354" cy="490" r="7" fill="#2362a2"/>
    <text x="356" y="389" font-size="18" fill="#087651">Dây tín hiệu START</text>
    <text x="356" y="521" font-size="18" fill="#b13b47">Dây tín hiệu STOP</text>
    <text x="356" y="634" font-size="18" fill="#2362a2">Một dây GND chung về bo</text>
    <text x="675" y="635" font-size="16" fill="#294b67">Giao dây không có chấm: không nối.</text>

    <text x="999" y="231" font-size="23" font-weight="bold" fill="#087651">START xanh · thường hở (NO)</text>
    <text x="999" y="258" font-size="18" fill="#294b67">Nhả: hở. Bấm: hai chân chạm nhau.</text>
    <text x="1075" y="389" text-anchor="middle" font-size="18" font-weight="bold" fill="#087651">NO</text>
    <text x="1175" y="389" text-anchor="middle" font-size="18" font-weight="bold" fill="#2362a2">COM</text>
    <path d="M1075 358 L1151 322" fill="none" stroke="#087651" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1075" cy="358" r="7" fill="#087651"/>
    <circle cx="1175" cy="358" r="7" fill="#2362a2"/>

    <text x="999" y="433" font-size="23" font-weight="bold" fill="#b13b47">STOP đỏ · thường hở (NO)</text>
    <text x="999" y="460" font-size="18" fill="#294b67">Nhả: hở. Bấm: hai chân chạm nhau.</text>
    <text x="1075" y="521" text-anchor="middle" font-size="18" font-weight="bold" fill="#b13b47">NO</text>
    <text x="1175" y="521" text-anchor="middle" font-size="18" font-weight="bold" fill="#2362a2">COM</text>
    <path d="M1075 490 L1151 470" fill="none" stroke="#b13b47" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1075" cy="490" r="7" fill="#b13b47"/>
    <circle cx="1175" cy="490" r="7" fill="#2362a2"/>
    <text x="999" y="562" font-size="18" fill="#294b67">Chỉ mang hai tín hiệu và GND.</text>
    <text x="999" y="586" font-size="18" fill="#294b67">Không kéo dây cấp nguồn ra nút.</text>
    <text x="999" y="638" font-size="16" fill="#294b67">Hộp rời: dùng một cáp 3 lõi qua ốc siết.</text>
    <text x="356" y="659" font-size="17" fill="#294b67">Trong hộp có thể dùng jumper tín hiệu ngắn; cố định các đầu cắm.</text>

    <rect x="38" y="699" width="665" height="177" rx="16" fill="#e5f4ee" stroke="#b0d6c7" stroke-width="2"/>
    <text x="64" y="734" font-size="22" font-weight="bold" fill="#075b41">ESP32 đọc IO33 để nhận START</text>
    <text x="64" y="770" font-size="19" fill="#173b36">Nhả: HIGH (~3,3 V) → chờ.</text>
    <text x="64" y="806" font-size="19" fill="#173b36">Bấm: LOW (~0 V) → yêu cầu tưới một lần.</text>
    <text x="64" y="842" font-size="19" fill="#173b36">Đứt dây ra nút: HIGH → không phát START.</text>

    <rect x="721" y="699" width="681" height="177" rx="16" fill="#fcebed" stroke="#e3c0c5" stroke-width="2"/>
    <text x="747" y="734" font-size="22" font-weight="bold" fill="#8b2737">ESP32 đọc IO32 để nhận STOP</text>
    <text x="747" y="770" font-size="19" fill="#522f3a">Nhả hoặc hở dây: HIGH → không phát STOP.</text>
    <text x="747" y="806" font-size="19" fill="#522f3a">Bấm / giữ: LOW → dừng và chặn START khi giữ.</text>
    <text x="747" y="842" font-size="19" fill="#522f3a">Nhả STOP không chạy lại phiên đã dừng.</text>

    <text x="42" y="917" font-size="19" fill="#294b67">STOP gửi tín hiệu cho bo; khóa nước tay vẫn dùng được nếu bo hoặc driver gặp lỗi.</text>
  </g>
</svg>
