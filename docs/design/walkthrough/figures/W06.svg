<text x="70" y="2705.870799999999" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#152d40"><tspan x="70" dy="0">• Ba nhánh từ chối là ví dụ độc lập: request rejected không tạo session mới, không</tspan><tspan x="70" dy="26.099999999999998">queue muộn.</tspan></text>
