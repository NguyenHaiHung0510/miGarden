<text x="834" y="2669.770799999999" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#152d40"><tspan x="834" dy="0">• Các nhánh BUSY/CLOCK_UNTRUSTED/CUMULATIVE_LIMIT là ví dụ độc lập,</tspan><tspan x="834" dy="26.099999999999998">không nối thành timeline chính.</tspan></text>
<text x="834" y="2731.9707999999987" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#152d40"><tspan x="834" dy="0">• Không chọn numeric cumulative budget hoặc đo khả năng safety arbiter trong fixture.</tspan></text>
<text x="834" y="2768.0707999999986" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#152d40"><tspan x="834" dy="0">• Trạng thái controller báo cáo không chứng minh van mở, dòng nước hay sức khỏe</tspan><tspan x="834" dy="26.099999999999998">cây.</tspan></text>
