name: Controller host and wire
on:
  pull_request:
    paths:
      - "code/controller/**"
      - "contracts/zone-a/v1/**"
      - ".github/workflows/controller-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch locked official ArduinoJson source
        shell: bash
        run: |
          git init "$RUNNER_TEMP/ArduinoJson"
          git -C "$RUNNER_TEMP/ArduinoJson" remote add origin https://github.com/bblanchon/ArduinoJson.git
          git -C "$RUNNER_TEMP/ArduinoJson" fetch --depth 1 origin 77771d3c07668e01d8f52acb03910c1110bb373f
          git -C "$RUNNER_TEMP/ArduinoJson" checkout --detach FETCH_HEAD
      - name: Install wire validator
        run: python -m pip install jsonschema==4.25.1 rfc3339-validator==0.1.4
      - name: Compile actual portable core and check wire
        shell: bash
        env:
          ARDUINOJSON_SOURCE: ${{ runner.temp }}/ArduinoJson
          HOST_OUTPUT: ${{ runner.temp }}/controller-host
        run: bash code/controller/ci-host.sh
